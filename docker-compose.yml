version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: govquery-postgres
    environment:
      POSTGRES_DB: census_data
      POSTGRES_USER: govquery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govquery_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - ./database/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    user: "999:999"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govquery -d census_data"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      postgres
      -c statement_timeout=30s
      -c idle_in_transaction_session_timeout=30s
